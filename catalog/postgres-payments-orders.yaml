apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: postgres-payments-orders
  title: orders (payments)
  description: Postgres database payments_orders on the shared server, provisioned by Crossplane
  annotations:
    # crossplane.io/composite=<name> is only unique within a namespace, so
    # the tenant label narrows it down. Not backstage.io/kubernetes-namespace:
    # a namespaced lookup also queries cluster-scoped kinds such as Tenant
    # and reports NOT_FOUND errors in the Kubernetes tab.
    backstage.io/kubernetes-label-selector: crossplane.io/composite=orders,idplatformkit.io/tenant=payments
  links:
    - url: https://github.com/idPlatformKit/instances/blob/main/databases/payments/orders.yaml
      title: PostgresDatabase claim
spec:
  type: database
  owner: group:default/checkout-engineers
  dependencyOf:
    - resource:default/tenant-payments
