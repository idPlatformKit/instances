name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CROSSPLANE_CLI_VERSION: v2.4.0

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The platform APIs (XRDs) the claims must match live in the
      # Orchestrator repository. If you install from a fork, point this at it.
      - uses: actions/checkout@v4
        with:
          repository: idPlatformKit/Orchestrator
          path: .orchestrator

      - name: Install the Crossplane CLI
        run: |
          curl -sSfL -o /usr/local/bin/crossplane \
            "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          chmod +x /usr/local/bin/crossplane

      - name: Validate claims against the XRDs
        run: |
          dirs=$(for d in tenants databases apps; do [ -d "$d" ] && echo "$d/"; done | paste -sd, -)
          if [ -z "$dirs" ] || ! find ${dirs//,/ } -name '*.yaml' | grep -q .; then
            echo "No claims yet: nothing to validate."
            exit 0
          fi
          crossplane resource validate --error-on-missing-schemas .orchestrator/compositions/ "$dirs"
