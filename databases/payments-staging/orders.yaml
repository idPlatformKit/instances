apiVersion: database.idplatformkit.io/v1alpha1
kind: PostgresDatabase
metadata:
  name: orders
  namespace: payments-staging
  labels:
    # Lets the portal find this database among same-named ones in other
    # namespaces (the value is the namespace). The composition sets the same label on what it composes.
    idplatformkit.io/tenant: payments-staging
spec:
  writeConnectionSecretToRef:
    name: orders-conn
