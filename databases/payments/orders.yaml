apiVersion: database.idplatformkit.io/v1alpha1
kind: PostgresDatabase
metadata:
  name: orders
  namespace: payments
  labels:
    # Lets the portal find this database among same-named ones in other
    # tenants. The composition sets the same label on what it composes.
    idplatformkit.io/tenant: payments
spec:
  writeConnectionSecretToRef:
    name: orders-conn
